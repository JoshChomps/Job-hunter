name: Refresh UK sponsor register

# The Home Office republishes the register at least monthly at a dated URL, and
# it is gate one of UK feasibility, an employer not on it cannot sponsor. This
# needs the current URL from:
# https://www.gov.uk/government/publications/register-of-licensed-sponsors-workers
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct CSV URL from gov.uk"
        type: string
        required: true

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Import register
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm sponsors:import -- --url="${{ inputs.url }}"
